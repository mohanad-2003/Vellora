<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Soft Mint Backdrop Circle (~170px diameter) -->
  <circle cx="120" cy="120" r="85" fill="#E4F1EC" />

  <!-- Thin Horizontal Clothes Rail -->
  <path d="M42,62 H198" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" />

  <!-- Clothes Hanger Hook -->
  <path d="M120,62 C120,48 132,48 132,56 C132,62 120,68 120,78" fill="none" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" />

  <!-- Hanger Body (Wooden/Wire Shape) -->
  <path d="M120,78 L64,124 C60,127 62,134 68,134 H172 C178,134 180,127 176,124 Z" fill="#CFE5DE" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Lower Crossbar Inner Line Highlight -->
  <path d="M74,134 H166" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" opacity="0.3" />

  <!-- Small Gold Hanging Tag (Attached to Hanger Bar) -->
  <path d="M136,134 V146" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" />

  <g transform="translate(136, 146) rotate(12)">
    <rect x="-8" y="0" width="16" height="24" rx="3" fill="#E85D04" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="0" cy="5" r="2" fill="#E4F1EC" />
  </g>

  <!-- Soft Shelf Line Beneath -->
  <path d="M54,182 H186" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" opacity="0.4" />

  <!-- Ground Soft Shadow on Shelf -->
  <ellipse cx="120" cy="182" rx="48" ry="4" fill="#CFE5DE" opacity="0.6" />

  <!-- Gold Accent Sparkle (Top Left) -->
  <path d="M56,82 L56,92 M51,87 L61,87" stroke="#E85D04" stroke-width="3" stroke-linecap="round" />
  <circle cx="56" cy="87" r="1.5" fill="#1F2A27" />

  <!-- Floating Decorative Dots -->
  <circle cx="184" cy="94" r="3" fill="#E85D04" />
  <circle cx="58" cy="152" r="3.5" fill="#0F5C4D" />
  <circle cx="188" cy="158" r="2" fill="#1F2A27" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Soft Mint Backdrop Circle (~170px diameter) -->
  <circle cx="120" cy="120" r="85" fill="#E4F1EC" />

  <!-- Base Soft Shadow -->
  <ellipse cx="120" cy="192" rx="42" ry="6" fill="#CFE5DE" />

  <!-- Magnifying Glass Handle (Angled Down-Right) -->
  <path d="M148,148 L182,182" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Handle Grip / Metallic Cap Detail -->
  <path d="M140,140 L148,148" stroke="#B8923F" stroke-width="3" stroke-linecap="round" />

  <!-- Magnifying Glass Rim & Lens -->
  <circle cx="106" cy="106" r="46" fill="#CFE5DE" stroke="#0F5C4D" stroke-width="3" />

  <!-- Lens Inner Soft Reflection Highlight -->
  <path d="M72,94 C76,78 90,68 106,68" fill="none" stroke="#E4F1EC" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Question-Mark-Like Curved Squiggle Inside Lens (No text, abstract empty search query) -->
  <path d="M96,96 C96,86 104,80 112,82 C118,84 120,90 116,96 C110,102 108,106 108,114" fill="none" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <circle cx="108" cy="126" r="2" fill="#0F5C4D" />

  <!-- Gold Accent Sparkle (Top Left) -->
  <path d="M52,52 L52,62 M47,57 L57,57" stroke="#B8923F" stroke-width="3" stroke-linecap="round" />
  <circle cx="52" cy="57" r="1.5" fill="#1F2A27" />

  <!-- Scattered Floating Dots (Evoking "Nothing Found / Empty Space") -->
  <circle cx="178" cy="76" r="3" fill="#B8923F" />
  <circle cx="168" cy="120" r="3.5" fill="#0F5C4D" />
  <circle cx="54" cy="138" r="2.5" fill="#1F2A27" />
  <circle cx="70" cy="172" r="3" fill="#0F5C4D" />
</svg>
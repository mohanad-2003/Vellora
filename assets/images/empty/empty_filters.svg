<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Soft Mint Backdrop Circle (~170px diameter) -->
  <circle cx="120" cy="120" r="85" fill="#E4F1EC" />

  <!-- Base Soft Shadow -->
  <ellipse cx="120" cy="190" rx="42" ry="6" fill="#CFE5DE" />

  <!-- Filter / Funnel Main Shape (Left Side) -->
  <g transform="translate(42, 60)">
    <!-- Funnel Body -->
    <path d="M12,12 L84,12 L56,56 V96 L40,108 V56 Z" fill="#CFE5DE" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Funnel Top Inner Lip Line -->
    <path d="M12,12 H84" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" />

    <!-- Gold Accent Line inside Funnel Body -->
    <path d="M28,26 H68" stroke="#E85D04" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Horizontal Slider Control Lines (Right Side) -->
  <g transform="translate(130, 68)">
    <!-- Slider Line 1 & Gold Knob -->
    <path d="M0,12 H52" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    <circle cx="16" cy="12" r="5" fill="#E85D04" stroke="#0F5C4D" stroke-width="3" />

    <!-- Slider Line 2 & Knob -->
    <path d="M0,32 H52" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    <circle cx="38" cy="32" r="5" fill="#CFE5DE" stroke="#0F5C4D" stroke-width="3" />

    <!-- Slider Line 3 & Knob -->
    <path d="M0,52 H52" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    <circle cx="22" cy="52" r="5" fill="#CFE5DE" stroke="#0F5C4D" stroke-width="3" />
  </g>

  <!-- Crossed-Out Circle (Suggesting "Filters Too Narrow / No Results") -->
  <g transform="translate(152, 142)">
    <circle cx="0" cy="0" r="18" fill="#E4F1EC" stroke="#0F5C4D" stroke-width="3" />
    <!-- Diagonal Slash -->
    <path d="M-12,-12 L12,12" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Gold Accent Sparkle (Top Left) -->
  <path d="M52,42 L52,52 M47,47 L57,47" stroke="#E85D04" stroke-width="3" stroke-linecap="round" />
  <circle cx="52" cy="47" r="1.5" fill="#1F2A27" />

  <!-- Floating Decorative Dots -->
  <circle cx="188" cy="54" r="3" fill="#E85D04" />
  <circle cx="48" cy="154" r="3.5" fill="#0F5C4D" />
  <circle cx="192" cy="120" r="2" fill="#1F2A27" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Soft Mint Backdrop Circle (~170px diameter) -->
  <circle cx="120" cy="120" r="85" fill="#E4F1EC" />

  <!-- Base Soft Shadow -->
  <ellipse cx="120" cy="188" rx="58" ry="7" fill="#CFE5DE" />

  <!-- Main Card Group (Rotated at a slight angle) -->
  <g transform="translate(120, 118) rotate(-9)">
    
    <!-- Blank Credit Card Base -->
    <rect x="-62" y="-40" width="124" height="80" rx="10" fill="#CFE5DE" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Soft Decorative Interior Wave / Highlight Line -->
    <path d="M-62,0 C-30,10 10,-20 62,-10" fill="none" stroke="#E4F1EC" stroke-width="3" stroke-linecap="round" opacity="0.8" />

    <!-- Gold Smart EMV Chip -->
    <rect x="-44" y="-20" width="18" height="14" rx="3" fill="#E85D04" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Chip Internal Contact Line -->
    <path d="M-35,-20 V-6 M-44,-13 H-26" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" opacity="0.4" />

    <!-- Empty Number / Holder Stripe Lines (Waiting to be filled) -->
    <path d="M-44,12 H10 M-44,22 H-10" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6" opacity="0.4" />

    <!-- Card Brand Accent Circles (Top Right) -->
    <circle cx="36" cy="-24" r="7" fill="none" stroke="#0F5C4D" stroke-width="3" opacity="0.3" />
    <circle cx="44" cy="-24" r="7" fill="none" stroke="#0F5C4D" stroke-width="3" opacity="0.3" />

    <!-- Small Plus Sign in Circle at Bottom Right Corner (Add Card / Payment) -->
    <g transform="translate(42, 22)">
      <circle cx="0" cy="0" r="11" fill="#E4F1EC" stroke="#0F5C4D" stroke-width="3" />
      <path d="M0,-5 V5 M-5,0 H5" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" />
    </g>

  </g>

  <!-- Gold Accent Sparkle (Top Right) -->
  <path d="M184,52 L184,62 M179,57 L189,57" stroke="#E85D04" stroke-width="3" stroke-linecap="round" />
  <circle cx="184" cy="57" r="1.5" fill="#1F2A27" />

  <!-- Floating Decorative Dots -->
  <circle cx="52" cy="74" r="3" fill="#E85D04" />
  <circle cx="58" cy="156" r="3.5" fill="#0F5C4D" />
  <circle cx="192" cy="140" r="2" fill="#1F2A27" />
</svg>
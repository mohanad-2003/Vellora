<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Soft Mint Backdrop Circle (~170px diameter) -->
  <circle cx="120" cy="120" r="85" fill="#E4F1EC" />

  <!-- Base Soft Shadow -->
  <ellipse cx="120" cy="190" rx="38" ry="5" fill="#CFE5DE" />

  <!-- Gentle Crescent Moon (Floating Behind Bell Top Left) -->
  <path d="M72,62 C62,72 65,88 78,94 C68,92 60,82 62,70 C63,66 66,63 72,62 Z" fill="#CFE5DE" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bell Ring Mount / Loop -->
  <path d="M120,62 V52" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" />
  <circle cx="120" cy="48" r="6" fill="#CFE5DE" stroke="#0F5C4D" stroke-width="3" />

  <!-- Main Bell Dome -->
  <path d="M80,154 C80,102 92,62 120,62 C148,62 160,102 160,154 Z" fill="#CFE5DE" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bell Bottom Flare & Lip -->
  <path d="M72,154 C72,148 168,148 168,154 C168,162 160,166 120,166 C80,166 72,162 72,154 Z" fill="#E4F1EC" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bell Internal Clapper (Rests peacefully at center) -->
  <path d="M120,166 C114,166 112,174 120,178 C128,174 126,166 120,166 Z" fill="#E85D04" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Champagne Gold Accent Line on Bell Surface -->
  <path d="M96,128 C108,132 132,132 144,128" fill="none" stroke="#E85D04" stroke-width="3" stroke-linecap="round" />

  <!-- Tiny Gold Star 1 (Lower Right - Replaces Z) -->
  <path d="M178,74 L178,82 M174,78 L182,78" stroke="#E85D04" stroke-width="3" stroke-linecap="round" />
  <circle cx="178" cy="78" r="1.5" fill="#1F2A27" />

  <!-- Tiny Gold Star 2 (Upper Right - Replaces Z) -->
  <path d="M192,52 L192,58 M189,55 L195,55" stroke="#E85D04" stroke-width="3" stroke-linecap="round" />

  <!-- Quiet Floating Decorative Dots -->
  <circle cx="58" cy="120" r="3" fill="#E85D04" />
  <circle cx="182" cy="128" r="3.5" fill="#0F5C4D" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Soft Mint Backdrop Circle (~170px diameter) -->
  <circle cx="120" cy="120" r="85" fill="#E4F1EC" />
  
  <!-- Parcel Box in Modern Isometric Line Art with Soft Fill -->
  <g transform="translate(70, 70)">
    <!-- Box Top Face -->
    <path d="M50,10 L90,30 L50,50 L10,30 Z" fill="#CFE5DE" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Box Front Right Face -->
    <path d="M90,30 V90 L50,110 V50 Z" fill="#CFE5DE" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Box Front Left Face -->
    <path d="M10,30 V90 L50,110 V50 Z" fill="#CFE5DE" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Ribbon Detail -->
    <!-- Ribbon Loop around vertical axis -->
    <path d="M30,40 V100 L50,110 L70,100 V40 L50,20 Z" fill="none" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
    <!-- Horizontal Cross Loop on Top Face -->
    <path d="M10,30 L50,10 M50,50 L90,30" fill="none" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

    <!-- Simple Elegant Bow at Intersection (Knot and Loops) -->
    <g transform="translate(50, 45)">
      <!-- Knot -->
      <path d="M0,0 C-10,-10 -10,10 0,0 C10,10 10,-10 0,0 Z" fill="#CFE5DE" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Left Loop -->
      <path d="M0,0 C-20,-10 -20,-20 0,0" fill="none" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Right Loop -->
      <path d="M0,0 C20,10 20,20 0,0" fill="none" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Delivery Route Graphic -->
  <g transform="translate(180, 70)">
    <!-- Dashed Curved Line -->
    <path d="M0,60 Q20,30 40,60" fill="none" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" />
    
    <!-- Gold Location Pin at End -->
    <path d="M40,60 C50,60 55,65 50,75 L40,95 L30,75 C25,65 30,60 40,60 Z" fill="#B8923F" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Small Emerald Circle in Pin Center -->
    <circle cx="40" cy="70" r="3" fill="#0F5C4D" />
  </g>

  <!-- Decorative Sparkles and Dots -->
  <!-- Upper Left Gold Sparkle -->
  <path d="M45,40 L45,50 M40,45 L50,45" stroke="#B8923F" stroke-width="3" stroke-linecap="round" />
  <!-- Small Ink Dot (bottom right) -->
  <circle cx="195, 175" r="2.5" fill="#1F2A27" />
  <!-- Small Gold Dot (above delivery path) -->
  <circle cx="215, 60" r="3" fill="#B8923F" />

</svg>
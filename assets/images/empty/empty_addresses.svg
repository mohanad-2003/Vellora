<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Soft Mint Backdrop Circle (~170px diameter) -->
  <circle cx="120" cy="120" r="85" fill="#E4F1EC" />

  <!-- Base Soft Shadow -->
  <ellipse cx="120" cy="188" rx="48" ry="6" fill="#CFE5DE" />

  <!-- Map Card Base -->
  <rect x="68" y="58" width="104" height="124" rx="14" fill="#E4F1EC" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Map Card Inner Soft Tint Layer (Clipped to Card Bounds) -->
  <g clip-path="url(#cardClip)">
    <clipPath id="cardClip">
      <rect x="68" y="58" width="104" height="124" rx="14" />
    </clipPath>

    <!-- Map Section Fills (Subtle Greenery/Districts) -->
    <path d="M68,58 L120,58 L100,105 L68,90 Z" fill="#CFE5DE" opacity="0.6" />
    <path d="M130,130 L172,110 L172,182 L110,182 Z" fill="#CFE5DE" opacity="0.6" />

    <!-- Soft Curved Street Lines (Primary & Secondary Routes) -->
    <path d="M68,125 C90,125 105,110 110,85 C115,60 140,58 172,58" fill="none" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" opacity="0.35" />

    <path d="M68,90 C85,95 105,115 125,120 C145,125 158,150 162,182" fill="none" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" opacity="0.35" />

    <path d="M125,120 L172,110" fill="none" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" opacity="0.35" />

    <!-- Dashed Target Circle (Where an address could be added) -->
    <circle cx="102" cy="142" r="15" fill="none" stroke="#0F5C4D" stroke-width="3" stroke-dasharray="4 5" stroke-linecap="round" opacity="0.5" />
    <circle cx="102" cy="142" r="3" fill="#0F5C4D" opacity="0.4" />
  </g>

  <!-- Re-render Map Card Border to ensure clean crisp outline over clip -->
  <rect x="68" y="58" width="104" height="124" rx="14" fill="none" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Large Emerald Location Pin Pinpoint Marker (Floating Central Pin) -->
  <g transform="translate(132, 94)">
    <!-- Pin Shadow on Map Surface -->
    <ellipse cx="0" cy="38" rx="8" ry="3" fill="#CFE5DE" />

    <!-- Pin Outer Body -->
    <path d="M0,36 C-3,32 -18,18 -18,0 C-18,-10 -10,-18 0,-18 C10,-18 18,-10 18,0 C18,18 3,32 0,36 Z" fill="#0F5C4D" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Inner Gold Center Dot -->
    <circle cx="0" cy="0" r="5" fill="#E85D04" />
  </g>

  <!-- Decorative Sparkle (Top Right) -->
  <path d="M192,48 L192,56 M188,52 L196,52" stroke="#E85D04" stroke-width="3" stroke-linecap="round" />

  <!-- Floating Decorative Dots -->
  <circle cx="52" cy="108" r="3" fill="#E85D04" />
  <circle cx="190" cy="158" r="3.5" fill="#0F5C4D" />
  <circle cx="58" cy="166" r="2" fill="#1F2A27" />
</svg>
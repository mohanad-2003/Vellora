<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Soft Mint Backdrop Circle (~170px diameter) -->
  <circle cx="120" cy="120" r="85" fill="#E4F1EC" />
  
  <!-- Subtle Inner Shadow Tone -->
  <path d="M120,35 A85,85 0 0,1 205,120 A85,85 0 0,1 180,172 L60,172 A85,85 0 0,1 35,120 A85,85 0 0,1 120,35 Z" fill="#CFE5DE" opacity="0.4" />

  <!-- Base Soft Shadow -->
  <ellipse cx="120" cy="188" rx="42" ry="6" fill="#CFE5DE" />

  <!-- Integrated Padlock and Key Structure -->
  <g transform="translate(120, 110)">
    <!-- Padlock Body (Rounded Rect) -->
    <rect x="-42" y="-30" width="84" height="60" rx="14" fill="#CFE5DE" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Faint Curved Pattern on Padlock Body -->
    <path d="M-28,-14 C-20,-18 -10,-18 -2,-14 M2,-14 C10,-18 20,-18 28,-14" fill="none" stroke="#E4F1EC" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    
    <!-- Large Rounded Shackle (Hanger) -->
    <path d="M-30,-30 V-58 C-30,-75 -18,-86 0,-86 C18,-86 30,-75 30,-58 V-30" fill="none" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Small User Silhouette Circle (No Face) -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="16" fill="#E4F1EC" stroke="#0F5C4D" stroke-width="3" />
      <path d="M0,-8 C-4.4,-8 -8,-4.4 -8,0 L0,0 C4.4,0 8,-4.4 8,0 Z M-10,12 C-10,7 0,7 0,7 L10,7 C10,7 10,12 10,12 L-10,12 Z" fill="#0F5C4D" opacity="0.9" />
    </g>
    
    <!-- Key Shaft -->
    <path d="M0,30 V68" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" />
    
    <!-- Decorative Gold Accents and Key Teeth Detail -->
    <g transform="translate(0, 68)">
      <!-- Gold Rim/Base of Teeth -->
      <path d="M-6,0 C-10,4 -10,10 0,10 C10,10 10,4 6,0 Z" fill="#B8923F" stroke="#0F5C4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Specialized Key Teeth -->
      <path d="M0,10 L0,22 M-8,14 H8 M-8,20 L8,20" fill="none" stroke="#B8923F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-4,20 L0,22 L4,20" fill="none" stroke="#B8923F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Small Gold Detail on Padlock -->
    <circle cx="30" cy="-6" r="3" fill="#B8923F" />
  </g>

  <!-- Decorative Sparkle (Top Right) -->
  <path d="M194,50 L194,60 M189,55 L199,55" stroke="#B8923F" stroke-width="3" stroke-linecap="round" />
  <circle cx="194" cy="55" r="1.5" fill="#1F2A27" />

  <!-- Floating Decorative Dots -->
  <circle cx="62" cy="74" r="3" fill="#B8923F" />
  <circle cx="58" cy="156" r="3.5" fill="#0F5C4D" />
  <circle cx="192" cy="140" r="2" fill="#1F2A27" />
</svg>
# Local PostgreSQL for development:  docker compose up -d
# Then:  DATABASE_URL=postgres://vellora:vellora@localhost:5432/vellora npm start
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vellora
      POSTGRES_PASSWORD: vellora
      POSTGRES_DB: vellora
    ports:
      - "5432:5432"
    volumes:
      - vellora_pg:/var/lib/postgresql/data
volumes:
  vellora_pg:
